{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Not Found</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body {
        font-family: 'Inter', sans-serif;
        background-image: url("{% static 'images/bg.png' %}");
        background-size: cover;
        background-position: center;
        min-height: 100vh;
    }
</style>
</head>
<body class="flex items-center justify-center">
<div class="text-center bg-white bg-opacity-90 p-10 rounded-lg shadow-lg">
    <i class="fas fa-search-minus text-6xl text-blue-600 mb-4"></i>
    <h1 class="text-4xl font-bold mb-2">404 Not Found</h1>
    <p class="mb-6 text-gray-700">The page you are looking for does not exist.</p>
    <form method="POST" action="{% url 'logout_and_redirect' %}">
        {% csrf_token %}
        <button type="submit" class="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">
            Go to Login
        </button>
    </form>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
</body>
</html>
